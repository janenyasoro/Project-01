<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width", initial-scale="1.0">
        <title> Contact Us</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <header>
            <h1>Curves & Contours Cosmetic Clinic</h1>
            <nav>
                <button class="nav-btn" data-page="home">Home</button>
                <button class="nav-btn" data-page="about">About</button>
                <button class="nav-btn" data-page="procedures">⚕️Procedures</button>
                <button class="nav-btn" data-page="contact">📞Contact</button>
            </nav>
        </header>

        <main>
            <!--contact page with form-->
            <h2>Contact Us</h2>
            <form id="contactForm">
                <div>
                    <label>Name:</label>
                    <input type="text" id="name" required>
                    <span class="error" id="nameError"></span>
                </div>
                <div>
                    <label>Email:</label>
                    <input type="email" id="email" required>
                    <span class="error" id="emailError"></span>
                </div>

                <div>
                    <label>Procedure Interest:</label>
                    <select id="procedure">
                        <option value="">Select a procedure</option>
                        <option>Facelift</option>
                        <option>Rhinoplasty</option>
                        <option>Liposuction</option>
                        <option>Breast Augmentation</option>
                        <option>Brazillian Butt Lift(BBL)</option>
                    </select>
                </div>

                <div>
                    <label>Message:</label>
                    <textarea id="message" rows="5"></textarea>
                </div>

                <button type="submit">Send Message</button>
                <button type="reset" id="resetForm">Clear Form</button>
            </form>

            <div id="formStatus"></div>

            <div class="live-chat">
                <h3>Live Chat Support</h3>
                <div id="chatMessages"></div>
                <input type="text" id="chatInput" placeholder="Type your question...">
                <button id="sendChat">Send</button>
            </div>
        </main>

        <script src="js/contact.js"></script>
        <script src="js/app.js"></script>
    </body>
</html>
